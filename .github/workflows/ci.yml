name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Install MAUI workload
        run: dotnet workload install maui

      - name: Restore
        run: dotnet restore OrganizadorCapitulos-Maui.sln

      - name: Build
        run: dotnet build OrganizadorCapitulos-Maui.sln -c Release --no-restore

      - name: Test
        run: dotnet test tests/OrganizadorCapitulos.Tests/OrganizadorCapitulos.Tests.csproj -c Release --no-restore
