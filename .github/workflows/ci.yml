name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 9.0.x

      - name: Install MAUI workload
        run: dotnet workload install maui-windows

      - name: Build
        run: dotnet build OrganizadorCapitulos-Maui.sln -c Release

      - name: Test
        run: dotnet test tests/OrganizadorCapitulos.Tests/OrganizadorCapitulos.Tests.csproj -c Release --no-build
