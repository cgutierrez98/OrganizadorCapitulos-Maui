<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="utf-8" />
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Organizador de Capítulos</title>
    <base href="/" />
    <link rel="stylesheet" href="css/bootstrap/bootstrap.min.css" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="stylesheet" href="css/theme.css" />
    <link rel="stylesheet" href="OrganizadorCapitulos.Maui.styles.css" />
    <link rel="icon" href="data:,">
    <script>
        try {
            var savedTheme = localStorage.getItem('theme');
            if (savedTheme === 'dark' || savedTheme === 'light') {
                document.documentElement.setAttribute('data-theme', savedTheme);
            }
        } catch { }
    </script>
</head>

<body>
    <div class="status-bar-safe-area"></div>
    <div id="app">Cargando...</div>

    <div id="blazor-error-ui">
        Ocurrió un error.
        <a href="" class="reload">Recargar</a>
        <a class="dismiss">🗙</a>
    </div>

    <script src="_framework/blazor.webview.js" autostart="false"></script>
    <script>
        // Small helper to set the theme and persist it to localStorage.
        // Also set a body class for compatibility and emit a debug log.
        window.setDataTheme = function (theme) {
            try { document.documentElement.setAttribute('data-theme', theme); } catch { }
            try { localStorage.setItem('theme', theme); } catch { }
            try {
                document.body.classList.remove('theme-light', 'theme-dark');
                document.body.classList.add('theme-' + theme);
            } catch { }
            try { console.debug('[Theme] setDataTheme', theme); } catch { }
        };
    </script>
    <script>
        (() => {
            const isTypingContext = (element) => {
                if (!element) return false;
                const tagName = element.tagName;
                return element.isContentEditable || tagName === 'INPUT' || tagName === 'TEXTAREA' || tagName === 'SELECT';
            };

            const normalizeShortcut = (event) => {
                const parts = [];

                if (event.ctrlKey || event.metaKey) parts.push('ctrl');
                if (event.shiftKey) parts.push('shift');
                if (event.altKey) parts.push('alt');

                let key = (event.key || '').toLowerCase();
                if (!key) return '';

                if (key === ',') key = 'comma';
                if (key === ' ') key = 'space';

                return [...parts, key].join('+');
            };

            document.addEventListener('keydown', (event) => {
                const keyLower = (event.key || '').toLowerCase();

                // Allow Escape to close open modals even when focused inside an input
                if (keyLower === 'escape') {
                    const escTarget = document.querySelector('[data-shortcut="escape"]');
                    if (escTarget && !escTarget.disabled) {
                        event.preventDefault();
                        escTarget.click();
                        return;
                    }
                }

                if (isTypingContext(document.activeElement)) return;

                // Direct '?' key shortcut (often shift+/)
                if (event.key === '?') {
                    const helpTarget = document.querySelector('[data-shortcut="?"]');
                    if (helpTarget && !helpTarget.disabled) {
                        event.preventDefault();
                        helpTarget.click();
                        return;
                    }
                }

                const shortcut = normalizeShortcut(event);
                if (!shortcut) return;

                const target = document.querySelector(`[data-shortcut="${shortcut}"]`);
                if (!target || target.disabled) return;

                event.preventDefault();
                target.click();
            });
        })();
    </script>
</body>

</html>
